<!DOCTYPE html>
<html>
<head>
    <title>Student Insight</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="intro">
    <h1>🎓 EduPredict AI</h1>
    <p>
        Intelligent Student Risk Prediction & Academic Performance Monitoring System
    </p>
</div>

<div class="card">
    <h2>📋 Enter Student Details</h2>
    <p class="hint">
        Please enter accurate academic details to generate a meaningful report.
    </p>

    <form method="post" action="/analyze">
        <label>Student Name</label>
        <input type="text" name="name" placeholder="e.g. Rahul Sharma" required>

        <label>Attendance Percentage</label>
        <input type="number" name="attendance" placeholder="0 – 100" required>

        <label>Internal Marks</label>
        <input type="number" name="internal" placeholder="Out of 100" required>

        <label>Assignment Score</label>
        <input type="number" name="assignment" placeholder="Out of 100" required>

        <label>Final Exam Score</label>
        <input type="number" name="exam" placeholder="Out of 100" required>

        <label>Average Study Hours per Day</label>
        <input type="number" name="study_hours" placeholder="e.g. 2" required>

        <button type="submit">Analyze Performance</button>
    </form>
</div>

</body>
</html>
